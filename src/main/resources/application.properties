spring.application.name=demo

spring.datasource.url=jdbc:mysql://localhost:3306/banco_tp2?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=banco_user
spring.datasource.password=admin123

# Directivas del Almacen del Dominio (Hibernate DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Forzar el registro detallado del mapeo de entidades
logging.level.org.hibernate.orm.boot=DEBUG
logging.level.org.hibernate.tool.schema=DEBUG