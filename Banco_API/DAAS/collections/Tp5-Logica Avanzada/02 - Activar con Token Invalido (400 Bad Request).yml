info:
  name: 02 - Activar con Token Invalido (400 Bad Request)
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/clientes/activar?token=token-falso-o-expirado-1234"
  params:
    - name: token
      value: token-falso-o-expirado-1234
      type: query
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
